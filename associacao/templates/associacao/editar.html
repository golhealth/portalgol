{% load static %}
<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Editar Associação | Gol Health</title>
    <link rel="icon" type="image/png" href="{% static 'core/img/Faveicon.png' %}">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        display: ["Lexend"],
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px",
                    },
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="flex min-h-screen">
        {% include "core/partials/app_sidebar.html" %}

    <main class="flex-1 ml-64 min-h-screen">
            {% include "core/partials/app_header.html" %}

        <div class="p-8">
            <div class="flex justify-between items-end mb-6 gap-4">
                <div class="min-w-0">
                    <h2 class="text-2xl font-bold truncate">Editar Associação</h2>
                    <p class="text-slate-500 dark:text-slate-400 text-sm">Atualize os dados do registo.</p>
                </div>
                <div class="flex items-center gap-3">
                    <a href="{% url 'associacao:detalhe' associacao.pk %}"
                       class="text-sm text-[#4c739a] hover:text-primary transition-colors flex items-center gap-2">
                        <span class="material-icons-round text-base">chevron_left</span>
                        Voltar
                    </a>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm p-6">
                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    <div class="space-y-4">
                        {{ form.as_p }}
                    </div>

                    <div class="flex justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                        <a href="{% url 'associacao:dashboard' %}"
                           class="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                            Cancelar
                        </a>
                        <button type="submit"
                                class="bg-primary hover:bg-primary/90 text-white px-8 py-2.5 rounded-lg font-bold shadow-lg shadow-primary/20 flex items-center gap-2 transition-all">
                            <span class="material-icons-round">save</span>
                            Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
