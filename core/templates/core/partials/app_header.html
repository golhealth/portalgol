<header class="h-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-20 px-8 flex items-center justify-between">
    {% if header_search_action %}
    <form method="get" action="{{ header_search_action }}" class="relative w-96 max-w-full" role="search" id="header-global-search-form">
        {% if header_preserve_ordenar %}
        <input type="hidden" name="ordenar" value="{{ header_preserve_ordenar }}"/>
        <input type="hidden" name="dir" value="{{ header_preserve_dir|default:'asc' }}"/>
        {% endif %}
        <span class="material-icons-round absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none z-10">search</span>
        <input name="q" id="header-global-search-q" value="{{ header_search_q|default:'' }}" class="w-full pl-10 pr-11 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg focus:ring-2 focus:ring-primary/50 text-sm" placeholder="Buscar árbitro, exame ou prestador..." type="text" autocomplete="off" enterkeyhint="search"/>
        <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 p-1 rounded-md text-slate-500 hover:text-primary hover:bg-primary/10 transition-colors" aria-label="Pesquisar">
            <span class="material-icons-round text-xl leading-none">arrow_forward</span>
        </button>
    </form>
    {% else %}
    <div class="relative w-96 max-w-full">
        <span class="material-icons-round absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
        <input class="w-full pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-lg focus:ring-2 focus:ring-primary/50 text-sm" placeholder="Buscar árbitro, exame ou prestador..." type="text"/>
    </div>
    {% endif %}
    <div class="flex items-center gap-6">
        <button type="button" class="relative text-slate-500 hover:text-primary transition-colors">
            <span class="material-icons-round">notifications</span>
            <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border-2 border-white dark:border-slate-900"></span>
        </button>
        <div class="relative">
            <button type="button" id="user-menu-toggle" class="flex items-center gap-3 pl-6 border-l border-slate-200 dark:border-slate-800">
                <div class="text-right hidden sm:block">
                    <p class="text-sm font-semibold">{{ request.user.get_username }}</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400">
                        {% if request.user.is_superuser %}
                            Superutilizador
                        {% elif request.user.groups.first %}
                            {{ request.user.groups.first.name }}
                        {% elif request.user.is_staff %}
                            Equipa
                        {% else %}
                            Utilizador
                        {% endif %}
                    </p>
                </div>
                <div class="w-10 h-10 rounded-full bg-slate-300 dark:bg-slate-700 flex items-center justify-center text-sm font-bold text-slate-800 dark:text-slate-100 overflow-hidden">
                    {% if request.user.perfil_conta.avatar %}
                        <img
                            src="{{ request.user.perfil_conta.avatar.url }}"
                            alt="Foto de perfil"
                            class="w-full h-full object-cover"
                        />
                    {% else %}
                        {{ request.user.get_username|first|upper }}
                    {% endif %}
                </div>
                <span class="material-icons-round text-slate-400 text-sm">expand_more</span>
            </button>
            <div id="user-menu" class="hidden absolute right-0 mt-2 w-52 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl shadow-lg py-2 z-40">
                <a href="{% url 'core:profile' %}?pwd=1" class="block px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800">Alterar palavra‑passe</a>
                <a href="{% url 'core:profile' %}" class="block px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800">Meu perfil</a>
                <form method="post" action="{% url 'logout' %}" class="mt-1">
                    {% csrf_token %}
                    <button type="submit" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20">Sair</button>
                </form>
            </div>
        </div>
    </div>
</header>
